[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/sshd.err.log
stdout_logfile=/var/log/supervisor/sshd.out.log

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/cron.err.log
stdout_logfile=/var/log/supervisor/cron.out.log

[program:atd]
command=/usr/sbin/atd -f
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/atd.err.log
stdout_logfile=/var/log/supervisor/atd.out.log

[program:ctf-bot]
command=python3 /var/ctf/bot/bot.py
directory=/var/ctf/bot
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/bot.err.log
stdout_logfile=/var/log/supervisor/bot.out.log

[program:ctf-web]
command=python3 /var/ctf/admin/server.py --port 8080
directory=/var/ctf/admin
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/web.err.log
stdout_logfile=/var/log/supervisor/web.out.log
